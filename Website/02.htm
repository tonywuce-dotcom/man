	<p>白海豚颱風日前從台灣北部海域通過<br>，經濟部水利署北區水資源分署今（12）日表示，石門水庫集水區颱風期間累計降雨量達166毫米，總入流量約3,986萬立方公尺、累計出流量3,276萬立方公尺，透過即時水情監測及水文預報精準操作，減少放流約710萬立方公尺，在降低下游洪水壓力的同時，維持區域供水穩定。</p>
