	<h2>文字格式</h2>
	<p><b>一般文字</b></p>
	<p><strong>一般文字粗體</strong></p>
	<p><i>一般文字斜體</i></p>
	<!-- 老師說這個很少用,註解用 -->
	<p><em>一般文字強調</em></p>
	<p><mark>一般文字標記</mark></p>
	<p><small>一般較小文字</small></p>
	<p><del>一般文字已刪除</del></p>
	<p><ins>一般文字插入</ins></p>
	<p><sub>一般文字下標</sub></p>
	<p><sup>一般文字上標</sup></p>
