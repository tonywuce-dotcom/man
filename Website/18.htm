<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>我的18個網頁_Styling Buttons</title>
	<style>
		.btn01{
			width: 100px;
			height: 30px;
			color: white;
			background-color: gray;
			font-size: 14px;
			font-family: sans-serif;
			text-align: center;
			line-height: 30px;
			padding: 5px;
			margin: 5px;
			border-radius:20px;
			/*
			border-radius 屬性用來設定元素的邊框圓角。
			它可以給一個、兩個、三個或四個值，
			單位可用像素 (px) 或百分比 (%)。
			當寬高相等的元素設為 50% 時會變成正圓形。
			*/
			border: 3px solid darkgray;
		}
		.btn01:hover{
			color: black;
			background-color: lightgray;
			box-shadow: 3px 3px 5px lightgray;
			/*
			box-shadow 屬性用來幫區塊加上陰影。
			完整語法是：
			box-shadow: inset x偏移 y偏移 模糊半徑 擴展半徑 顏色;。
			*/
		}

	</style>
</head>
<body>
	<h2> css Styling Buttons</h2>
	<button class="btn01">button按鈕</button>
	<input clqss="btn01" type="button" value="input按鈕">
	<div class="btn01">div按鈕</div>
	<p class="btn01">p按鈕</p>
	
	<a href="index.htm">回首頁</a>
</body>
</html>
